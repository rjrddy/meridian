name: CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: make setup build lint test
      - run: .venv/bin/python -m pip_audit && npm audit --prefix apps/web --audit-level=high
      - name: Fresh clone Compose smoke
        run: |
          git clone --no-local . /tmp/meridian-clean
          cd /tmp/meridian-clean
          cp .env.example .env
          docker compose up --build -d --wait
          curl --fail http://localhost:8000/health
          docker compose logs > compose.log
          docker compose down
